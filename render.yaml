services:
  - type: worker
    name: discord-ai-chatbot
    env: python
    region: oregon
    plan: free
    branch: clean-main
    buildCommand: pip install -r requirements.txt && python -m pip install duckduckgo-search==5.3.1
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
